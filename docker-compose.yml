services:
  postgres:
    image: postgres:16-alpine
    container_name: crypto-terminal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_terminal
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_terminal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
